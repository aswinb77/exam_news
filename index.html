      </p>

    <!-- Top Latest Featured Announcement Card (Hero Spotlight) -->
    <section id="featured-hero-card" class="mb-14">
      <!-- Injected by JavaScript with top latest announcement -->
    </section>

    <!-- Filter Pills & Sort Row -->
    <section class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6">
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="setFilter('all')" class="filter-pill active px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium transition" data-filter="all">
          All
        </button>
        <button onclick="setFilter('Registration open')" class="filter-pill px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium transition" data-filter="Registration open">
          Registration open
        </button>
        <button onclick="setFilter('Registration closing')" class="filter-pill px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium transition" data-filter="Registration closing">
          Registration closing
        </button>
        <button onclick="setFilter('Admit card out')" class="filter-pill px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium transition" data-filter="Admit card out">
          Admit card out
        </button>
        <button onclick="setFilter('Result declared')" class="filter-pill px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium transition" data-filter="Result declared">
          Result declared
        </button>
        <button onclick="setFilter('Answer key')" class="filter-pill px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium transition" data-filter="Answer key">
          Answer key
        </button>
        <button onclick="setFilter('NEET (UG)')" class="filter-pill px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium transition" data-filter="NEET (UG)">
          NEET (UG)

          GATE 2027

      </div>

      <!-- Sort Dropdown -->
      <div class="relative w-full sm:w-44 shrink-0">
        <select 
          id="sort-select"
          class="w-full bg-white border border-slate-200 rounded-xl pl-3.5 pr-8 py-1.5 text-xs sm:text-sm text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 shadow-sm appearance-none cursor-pointer transition"
        >

          <option value="alphabetical">Alphabetical (A–Z)</option>
          <option value="exam">By Portal</option>
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-slate-400">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
      </div>
    </section>

    <div class="mb-4">
      <span id="counter-text" class="text-xs sm:text-sm text-slate-500 font-medium">0 announcements</span>
    </div>

    <!-- Cards List -->
    <main>
      <div id="announcements-list" class="space-y-3">
        <!-- Rendered by JavaScript -->
      </div>
    </main>

    <footer class="mt-16 pt-6 border-t border-slate-200 text-center text-xs text-slate-400">

    const MONTH_MAP = {
      january: 0, jan: 0,
      february: 1, feb: 1,
      march: 2, mar: 2,
      april: 3, apr: 3,
      may: 4,
      june: 5, jun: 5,

    };

    function parseNoticeDate(title) {
      if (!title) return null;
      // Pattern 1: e.g. 12th October 2026 or 21 June 2026
      const m1 = title.match(/(\d{1,2})(?:st|nd|rd|th)?[\s\.\-\/]+([A-Za-z]+)[\s\.\-\/]+(\d{4})/i);
      if (m1) {
        const day = parseInt(m1[1], 10);
        const mStr = m1[2].toLowerCase();
        const year = parseInt(m1[3], 10);
        if (MONTH_MAP[mStr] !== undefined) {
          const month = MONTH_MAP[mStr];
          // End of day in IST (23:59:59 IST = 18:29:59 UTC)
          const istTimestamp = Date.UTC(year, month, day, 18, 29, 59);
          const localDate = new Date(year, month, day, 23, 59, 59);
          const ordinal = (m1[0].match(/st|nd|rd|th/i) || ['th'])[0];
          return {
            day,
            month,
            year,
            date: localDate,
            istTimestamp,
            formatted: `${day}${ordinal} ${m1[2]} ${year}`
          };
        }
      }
      // Pattern 2: DD.MM.YYYY or DD/MM/YYYY
      const m2 = title.match(/(\d{1,2})[\.\/](\d{1,2})[\.\/](\d{4})/);
      if (m2) {
        const day = parseInt(m2[1], 10);
        const month = parseInt(m2[2], 10) - 1;
        const year = parseInt(m2[3], 10);
        const localDate = new Date(year, month, day, 23, 59, 59);
        const istTimestamp = Date.UTC(year, month, day, 18, 29, 59);
        return {
          day,
          month,
          year,
          date: localDate,
          istTimestamp,
          formatted: `${day}/${month + 1}/${year}`
        };
      }
      return null;
    }

      const totalSecs = Math.floor(ms / 1000);
      const hours = Math.floor(totalSecs / 3600);
      const mins = Math.floor((totalSecs % 3600) / 60);
      const secs = totalSecs % 60;
      const pad = (n) => String(n).padStart(2, '0');
      if (hours > 0) {
        return `${hours}h ${pad(mins)}m ${pad(secs)}s`;

      return `${pad(mins)}m ${pad(secs)}s`;

      const isPast = parsedDate && (parsedDate.date < now && !isToday);
      const isFuture = parsedDate && (parsedDate.date > now && !isToday);
      const diffDays = parsedDate ? Math.ceil((parsedDate.date - now) / (1000 * 60 * 60 * 24)) : null;
      const dateDisplay = parsedDate ? parsedDate.formatted : null;

      // 1. Result declared -> Purple, Date shown: "Declared on" or "Results on"
      if (text.includes('result') || text.includes('score card') || text.includes('topper') || text.includes('rank')) {
        if (isFuture) {

            badge: 'Result scheduled',
            badgeClass: 'bg-purple-50 text-purple-700 border border-purple-200',
            rightTop: `Results on ${dateDisplay}`,
            rightBottom: diffDays ? `In ${diffDays} days` : 'Official schedule'
          };
        }
        return {
          type: 'Result declared',
          badge: 'Result declared',
          badgeClass: 'bg-purple-100 text-purple-700 border border-purple-200',
          rightTop: dateDisplay ? `Declared on ${dateDisplay}` : 'Result declared',
          rightBottom: 'Scorecard live'
        };
      }

      // 2. Admit card out -> Green, Date shown: "Exam on"
      if (text.includes('admit card') || text.includes('hall ticket') || text.includes('city allotment') || text.includes('advance intimation of examination city')) {
        if (text.includes('tba')) {
          return {
            type: 'Admit card out',
            badge: 'Admit card (TBA)',
            badgeClass: 'bg-slate-100 text-slate-700 border border-slate-200',
            rightTop: 'To be announced',
            rightBottom: 'Download TBA'
          };
        }
        if (isFuture) {
          return {
            type: 'Admit card out',
            badge: 'Admit card scheduled',
            badgeClass: 'bg-emerald-50 text-emerald-700 border border-emerald-200',
            rightTop: dateDisplay ? `Release on ${dateDisplay}` : 'Admit card notified',
            rightBottom: diffDays ? `In ${diffDays} days` : 'Download scheduled'
          };
        }
        return {
          type: 'Admit card out',
          badge: 'Admit card out',
          badgeClass: 'bg-emerald-100 text-emerald-700 border border-emerald-200',
          rightTop: dateDisplay ? `Exam on ${dateDisplay}` : 'Admit card out',
          rightBottom: 'Download admit card'
        };
      }

      // 3. Rectification windows
      if (text.includes('application rectification') || text.includes('rectification')) {
        if (text.includes('opening date') && isFuture) {
          return {
            type: 'Notification',
            badge: 'Rectification upcoming',
            badgeClass: 'bg-indigo-50 text-indigo-700 border border-indigo-200',
            rightTop: `Opens on ${dateDisplay}`,
            rightBottom: diffDays ? `In ${diffDays} days` : 'Correction window'
          };
        }
        if (text.includes('closing date') && isFuture) {
          return {
            type: 'Registration closing',
            badge: 'Rectification closes',
            badgeClass: 'bg-orange-50 text-orange-700 border border-orange-200',
            rightTop: `Closes on ${dateDisplay}`,
            rightBottom: diffDays ? `${diffDays} days left` : 'Late correction'
          };
        }
      }

      // 4. Registration closing -> Slate if closed, Orange if active
      if (text.includes('closing date') || text.includes('last date') || text.includes('extended online registration') || text.includes('final opportunity') || text.includes('refund window') || text.includes('open till') || text.includes('closing')) {
        if (isPast) {
          return {
            type: 'Registration closing',
            badge: 'Closed',
            badgeClass: 'bg-slate-100 text-slate-600 border border-slate-200',
            rightTop: `Closed on ${dateDisplay || 'schedule'}`,
            rightBottom: 'Deadline passed'
          };
        }
        return {
          type: 'Registration closing',
          badge: 'Registration closing',
          badgeClass: 'bg-orange-100 text-orange-700 border border-orange-200',
          rightTop: dateDisplay ? `Closes on ${dateDisplay}` : 'Closing soon (<= 7 days)',
          rightBottom: diffDays ? `${diffDays} day${diffDays === 1 ? '' : 's'} left` : 'Late fee applicable'
        };
      }

      // 5. Registration open -> Blue, Date shown: "Closes on, with days left"
      const isDocumentNotice = text.includes('advisory') || text.includes('instruction') || text.includes('updation of document') || text.includes('rectification') || text.includes('correction in') || text.includes('syllabus') || text.includes('fake');
      
      if (!isDocumentNotice && (text.includes('inviting online application') || text.includes('opening date of') || text.includes('regular online registration') || text.includes('portal is live'))) {
        if (isPast) {
          return {
            type: 'Registration open',
            badge: 'Portal active',
            badgeClass: 'bg-blue-50 text-blue-700 border border-blue-200',
            rightTop: dateDisplay ? `Opened on ${dateDisplay}` : 'Registration open',
            rightBottom: 'Apply on portal'
          };
        }
        return {
          type: 'Registration open',
          badge: 'Registration open',
          badgeClass: 'bg-blue-100 text-blue-700 border border-blue-200',
          rightTop: dateDisplay ? `Closes on ${dateDisplay}` : 'Registration open',
          rightBottom: 'Apply on portal'
        };
      }

      // 6. Answer key -> Grey, Date shown: "Objections close"
      if (text.includes('answer key') || text.includes('omr') || text.includes('challenge of provisional') || text.includes('recorded response')) {
        return {
          type: 'Answer key',
          badge: 'Answer key',
          badgeClass: 'bg-slate-100 text-slate-700 border border-slate-200',
          rightTop: dateDisplay ? `Objections close ${dateDisplay}` : 'Answer key out',
          rightBottom: 'Submit objections'
        };
      }

      // 7. Exam date -> Grey, Date shown: "Exam on"
      if (text.includes('examination on') || text.includes('examinations') || text.includes('exam held') || text.includes('re-examination on') || text.includes('conduct of re-examination')) {
        return {
          type: 'Exam date',
          badge: 'Exam date',
          badgeClass: 'bg-slate-100 text-slate-700 border border-slate-200',
          rightTop: dateDisplay ? `Exam on ${dateDisplay}` : 'Exam date notified',
          rightBottom: diffDays && diffDays > 0 ? `In ${diffDays} days` : 'Check schedule'
        };
      }

      // 8. Notification -> Grey, Date shown: "Registration opens / Official update"
      return {
        type: 'Notification',
        badge: 'Notification',
        badgeClass: 'bg-slate-100 text-slate-700 border border-slate-200',
        rightTop: dateDisplay ? `Date: ${dateDisplay}` : 'Official update',
        rightBottom: item.exam
      };
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-pill').forEach(btn => {
        if (btn.dataset.filter === filter) {
          btn.className = 'filter-pill active bg-slate-900 text-white px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium transition';
        } else {
          btn.className = 'filter-pill bg-white hover:bg-slate-100 text-slate-600 border border-slate-200 px-4 py-1.5 rounded-full text-xs sm:text-sm font-medium transition';
        }
      });
      renderHeroCard();
      render();
    }

    function toggleExpand(index) {
      if (expandedIds.has(index)) {
        expandedIds.delete(index);
      } else {
        expandedIds.add(index);
      }
      render();
    }

    function render() {
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      const sortValue = document.getElementById('sort-select').value;
      const listContainer = document.getElementById('announcements-list');

      // Filter
      let filtered = allData.filter((item) => {
        const meta = getCategoryMeta(item);
        let matchFilter = true;
        if (currentFilter === 'NEET (UG)') matchFilter = item.exam === 'NEET (UG)';
        else if (currentFilter === 'GATE 2027') matchFilter = item.exam === 'GATE 2027';
        else if (currentFilter === 'Registration closing') matchFilter = (meta.type === 'Registration closing' || meta.badge.toLowerCase().includes('closing') || meta.badge.toLowerCase().includes('closes') || meta.badge.toLowerCase().includes('closed'));
        else if (currentFilter !== 'all') matchFilter = (meta.type === currentFilter);

        const matchSearch = !searchQuery || 
          item.title.toLowerCase().includes(searchQuery) ||
          item.category.toLowerCase().includes(searchQuery) ||
          item.exam.toLowerCase().includes(searchQuery) ||
          meta.badge.toLowerCase().includes(searchQuery);

        return matchFilter && matchSearch;
      });

      // Sort
      if (sortValue === 'alphabetical') {
        filtered.sort((a, b) => a.title.localeCompare(b.title));
      } else if (sortValue === 'exam') {
        filtered.sort((a, b) => a.exam.localeCompare(b.exam));
      }

      // Top 25 limit
      const TOP_LIMIT = 25;
      const displayList = filtered.slice(0, TOP_LIMIT);

      // Update counter
      if (filtered.length > TOP_LIMIT) {
        document.getElementById('counter-text').innerHTML = 
          `<span class="font-semibold text-slate-800">Top 25 latest announcements</span> <span class="text-slate-400 font-normal">(${filtered.length} total found)</span>`;
      } else {
        document.getElementById('counter-text').textContent = `${filtered.length} announcements`;
      }

      if (filtered.length === 0) {
        listContainer.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-2xl p-12 text-center text-slate-500 shadow-sm">
            <svg class="w-10 h-10 mx-auto text-slate-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p class="font-semibold text-slate-700">No announcements found</p>
            <p class="text-xs text-slate-400 mt-1">Try another filter pill or search query.</p>
          </div>
        `;
        return;
      }

      listContainer.innerHTML = displayList.map((item, index) => {
        const isExpanded = expandedIds.has(index);
        const isPdf = isPdfLink(item.url);
        const domain = getDomain(item.url);
        const meta = getCategoryMeta(item);

        return `
          <div class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-5 shadow-sm hover:border-slate-300 transition-all">
            
            <!-- Clickable Header Row -->
            <div class="cursor-pointer select-none" onclick="toggleExpand(${index})">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                
                <!-- Left: Title & Categorized Badge -->
                <div class="flex items-center gap-2 flex-wrap flex-1 pr-2">
                  <h2 class="text-base font-bold text-slate-900 hover:text-blue-600 transition">
                    ${item.title}
                  </h2>
                  <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[11px] font-semibold ${meta.badgeClass}">
                    ${meta.badge}
                  </span>
                  ${isPdf ? `
                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-semibold bg-red-50 text-red-600 border border-red-200">
                      PDF Document
                    </span>
                  ` : ''}
                </div>

                <!-- Right: Categorized Date / Status Meta -->
                <div class="text-left sm:text-right shrink-0">
                  <span class="text-xs font-bold text-slate-800 block">
                    ${meta.rightTop}
                  </span>
                  <span class="text-[11px] text-slate-400 block font-mono">
                    ${meta.rightBottom}
                  </span>
                </div>

              </div>

              <!-- Subtitle metadata line -->
              <p class="text-xs text-slate-400 mt-1.5 flex items-center gap-1.5 flex-wrap">
                <span class="font-medium text-slate-600">${item.exam}</span>
                <span>•</span>
                <span>${item.category}</span>
                <span>•</span>
                <span class="text-slate-500 font-mono text-[11px]">${domain}</span>
              </p>
            </div>

            <!-- Expandable Details Accordion -->
            ${isExpanded ? `
              <div class="mt-4 pt-4 border-t border-slate-100">
                <p class="text-xs text-slate-600 leading-relaxed mb-3">
                  Official notification released on the ${item.exam} portal. Click below to view or download the complete notice directly.
                </p>

                <!-- Metadata Grid Box -->
                <div class="bg-slate-50 border border-slate-100 rounded-xl p-3.5 mb-4 grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                  <div>
                    <span class="text-slate-400 block text-[11px]">Portal</span>
                    <strong class="text-slate-800 font-semibold">${item.exam}</strong>
                  </div>
                  <div>
                    <span class="text-slate-400 block text-[11px]">Category</span>
                    <strong class="text-slate-800 font-semibold">${item.category}</strong>
                  </div>
                  <div>
                    <span class="text-slate-400 block text-[11px]">Format</span>
                    <strong class="text-slate-800 font-semibold">${isPdf ? 'PDF File' : 'Web Link'}</strong>
                  </div>
                  <div>
                    <span class="text-slate-400 block text-[11px]">Source Server</span>
                    <strong class="text-slate-800 font-semibold truncate block" title="${domain}">${domain}</strong>
                  </div>
                </div>

                <!-- Action Button -->
                <div class="flex items-center gap-3">
                  <a 
                    href="${item.url}" 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-xs sm:text-sm px-5 py-2.5 rounded-xl shadow-sm transition"
                  >
                    <span>${isPdf ? 'Download PDF Document' : 'Official website'}</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                  </a>

                  <button 
                    onclick="toggleExpand(${index})"
                    class="text-xs text-slate-400 hover:text-slate-600 px-3 py-2 transition"
                  >
                    Collapse
                  </button>
                </div>
              </div>
            ` : ''}

          </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      setFilter('all');
    });

    document.getElementById('search-input').addEventListener('input', render);
    document.getElementById('sort-select').addEventListener('change', render);

    loadData();
  </script>
</body>
</html>
